# Build & run the Juice Shop target FROM THIS SOURCE TREE (your editable copy).
# Edit the source, then rebuild:
#     docker compose up --build -d      ->  http://localhost:3000
# main (unmodified source) = your vulnerable BASELINE.
# Each fix lives on its own branch; the git diff is your before/after.
services:
  juice-shop:
    build: .
    container_name: juice-shop-fromsrc
    ports:
      - "3000:3000"
    restart: unless-stopped
